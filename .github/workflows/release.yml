name: Release

# Builds the installer and publishes it.
#
# Deliberately does NOT run the test suite: `pnpm check` is the gate before
# tagging, and repeating it here would double the wait for a commit already
# known to be good.
#
# Two ways in. Push a `v1.2.3` tag, or run it from the Actions tab and give it
# a version — the manual run tags the commit it built and publishes the same
# release, so a release never has to be assembled by hand.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.3. Leave empty to build without publishing.'
        required: false
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # Generous, but the Node download and Inno Setup install are network-bound,
    # and a hung step should fail rather than run until the account limit.
    timeout-minutes: 25

    steps:
      # Every action is pinned to a commit, not a tag. A tag can be moved to
      # point at new code, and this job holds `contents: write` and produces
      # the installer people run as Administrator. The comment after each is
      # the tag that commit was, for whoever bumps them next.
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        # Version deliberately not pinned here: it comes from the
        # "packageManager" field in package.json, and specifying it in both
        # places is an error.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Matches the runtime the installer bundles.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # `pnpm -r` builds in workspace dependency order, so @winpanel/shared
        # exists before anything resolves it.
        run: pnpm build

      - name: Stage the installer bundle
        # Downloads the Node runtime and service wrapper, verifying the Node
        # download against the checksums published by nodejs.org.
        run: pnpm --filter @winpanel/installer bundle

      - name: Work out the version
        id: version
        # Read through the environment rather than interpolated straight into
        # the script: a workflow input is a free-text string, and pasting it
        # into a shell would run whatever it contained.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION -replace '^v', ''
          } elseif ($env:REF_TYPE -eq 'tag') {
            # Tags are written v1.2.3; the installer wants 1.2.3.
            $version = $env:REF_NAME -replace '^v', ''
          } else {
            $version = '0.0.0-dev'
          }

          if ($version -ne '0.0.0-dev' -and
              $version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            throw "Version '$version' is not a version number like 1.2.3."
          }

          $publish = if ($version -eq '0.0.0-dev') { 'false' } else { 'true' }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $version (publishing: $publish)"

      - name: Compile the installer
        # No separate compiler install step: the build script fetches a pinned
        # Inno Setup, checks it against a recorded hash and its Authenticode
        # signature, and installs it for the current user. Chocolatey's package
        # tracks the latest release, which now includes a version 7 that
        # installs elsewhere, so a release would break the day it was promoted.
        #
        # This is also the same script used to build an installer locally, so
        # a release is not produced by a code path nobody exercises until
        # release day.
        env:
          WINPANEL_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm --filter @winpanel/installer installer

      - name: Generate checksum
        # Published alongside the installer so anyone can confirm the file they
        # downloaded is the one this workflow produced.
        run: |
          $file = "dist\WinPanel-Setup-x64.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  WinPanel-Setup-x64.exe" | Out-File -Encoding ascii "dist\SHA256SUMS.txt"
          Write-Host "SHA-256: $hash"

      - name: Upload build artefacts
        # Available on every run, including manual ones that create no release.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winpanel-installer
          path: |
            dist/WinPanel-Setup-x64.exe
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Named explicitly so a manual run works too: the tag does not have
          # to exist beforehand, and is created against the commit just built.
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: WinPanel ${{ steps.version.outputs.version }}
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            dist/WinPanel-Setup-x64.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Installing

            1. Download `WinPanel-Setup-x64.exe` below and copy it to your server.
            2. Run it as administrator.
            3. Open the address it shows you and enter the setup code.

            Nothing needs to be installed first — the installer carries its own
            Node runtime.

            Full instructions, including the parts your hosting provider has to
            do, are in [DEPLOYMENT.md](DEPLOYMENT.md).

            ### Verifying the download

            ```powershell
            (Get-FileHash .\WinPanel-Setup-x64.exe -Algorithm SHA256).Hash.ToLower()
            ```

            Compare with `SHA256SUMS.txt`.

            ### Getting help

            Ask on [Discord](https://discord.gg/wT6mnfAnUD).
