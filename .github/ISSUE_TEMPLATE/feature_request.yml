name: Feature request
description: Suggest something WinPanel should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        Describe the situation rather than the feature. Knowing what you were
        trying to achieve often turns up a simpler answer than the one asked for.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like WinPanel to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How are you working around it today?

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is something a server administrator would use, not a one-off script.
